@keyframes fadein{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}@keyframes zoomin{from{opacity:0;transform:scale(.92)}}

.lc.sel{outline:0;box-shadow:0 0 0 3px var(--acc)}
.dot{transition:transform .15s var(--e),background-color .15s}.lc .dot:hover,.lc .dot:active{transform:scale(1.18);background:var(--acc)}
.mini{padding:4px 12px;font-size:14px;border-radius:16px}.mini.on{background:var(--acc);color:var(--paper)}

function pack(n){const s=n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/,/g,'.');
 const m=/(?:(\d+)\s*[x×*]\s*)?(\d+(?:\.\d+)?)\s*(kg|gr|g|ml|cl|l)(?![a-z])/.exec(s);if(!m)return null;
 let v=parseFloat(m[2])*(m[1]?+m[1]:1);const t=s.slice(m.index+m[0].length).match(/^\s*[x×*]\s*(\d+)(?!\d|\.\d|\s*(?:kg|gr|g|ml|cl|l)(?![a-z]))/);if(t)v*=+t[1];
 const u=m[3];if(!(v>0))return null;

 if(u==='l')return{v,k:'L'};if(u==='ml')return{v:v/1000,k:'L'};return{v:v/100,k:'L'}}

function produse(m){

 if(!rs.length){m.insertAdjacentHTML('beforeend','<p class="mute">Produsele apar după ce ai cecuri citite.</p>');bindSv(m);return}

function shopInfo(k){if(!k)return null;const c=canon(k),by={};
 R.filter(r=>!r.pending).forEach(r=>r.items.forEach(i=>{if(ck(i.n)!==c)return;const s=sk(r.store),o=by[s];if(!o||r.ts>=o.ts)by[s]={s,n:r.store,ts:r.ts,u:i.u,up:unitP(i.n,i.q,i.u)}}));

const STOP=new Set(['buc','pcs','tip','set','gr','kg','pret']);
const spec=n=>{const s=n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/,/g,'.');
 const pc=(s.match(/(\d+(?:\.\d+)?)\s*%/)||[])[1],pk=pack(n);
 const w=(s.replace(/(\d+(?:\.\d+)?)\s*(%|kg|gr|g|ml|cl|l)(?![a-z])/g,' ').match(/[a-zа-я]{3,}/g)||[]).filter(x=>!STOP.has(x));
 return{pc:pc?+pc:null,pk,w}};
const bgm=s=>{const a=new Set();for(let i=0;i<s.length-1;i++)a.add(s.slice(i,i+2));return a};
const samePk=(A,B)=>A.pk&&B.pk&&A.pk.k===B.pk.k&&Math.abs(A.pk.v-B.pk.v)<1e-9;
function score(A,B){
 if(A.pc!=null&&B.pc!=null&&A.pc!==B.pc)return 0;if(A.pk&&B.pk&&A.pk.k!==B.pk.k)return 0;
 const[sm1,lg]=A.w.length<=B.w.length?[A.w,B.w]:[B.w,A.w];let m=0;
 for(const x of sm1)if(lg.some(y=>x===y||(Math.min(x.length,y.length)>=4&&(x.startsWith(y)||y.startsWith(x)))))m++;
